spring.application.name=code-reviewer
server.port=${PORT:8080}

# --- Google Cloud / Vertex AI (injected by deploy.sh on Cloud Run) ---
gcp.project=rootcause-507019
gcp.location=us-central1
firebase.project=reviewer-b36ee

# Model IDs — verify they exist in Vertex AI Model Garden for your region.
${review.model=${REVIEW_MODEL:gemini-3.5-flash-lite}
embed.model=${EMBED_MODEL:text-embedding-005}

# --- App limits & behaviour ---
app.maxCodeChars=${MAX_CODE_CHARS:20000}
app.topKRules=${TOP_K_RULES:4}
# Optional: point at an external CSV. Blank = use the bundled classpath rules.
app.rulesCsvPath=${RULES_CSV_PATH:}

# Serve the frontend from src/main/resources/static
spring.web.resources.static-locations=classpath:/static/


